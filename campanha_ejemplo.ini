; ===========================================================================
; Plantilla de configuración de campaña para process_adcp_bathimetric_v4.py
; Uso:  python <ruta_al_script>\process_adcp_bathimetric_v4.py --config campanha.ini
;
; - Copiá este archivo dentro de la carpeta de cada campaña y completalo.
; - Las rutas RELATIVAS se resuelven respecto de la ubicación de ESTE .ini.
; - La línea de comandos SIEMPRE tiene prioridad sobre lo que pongas acá.
; - El nombre de la sección de metadatos puede ser [campanha], [campania] o
;   [campaña]: las tres se reconocen.
; ===========================================================================

; --- Metadatos (solo trazabilidad; se copian a procesamiento.txt) ----------
[campanha]
campanha       = 2026-04-15  Río Neuquén inferior
operador       =
equipo         = SonTek RiverSurveyor M9  (s/n ...)
nivel_regla    =            ; nivel/regla o estación de referencia
observaciones  =

; --- Parámetros de procesamiento -------------------------------------------
[procesamiento]
; Entradas: carpeta con los .mat, o varios .mat (uno por línea o separados por coma)
inputs             = ./crudo/adcp
outdir             = ./procesado
survey-name        = relevamiento

; Eje del río y pelo de agua
centerline         = ../../ejes/rio_neuquen_inferior/r_nqn_inf.shp
water-surface-csv  = ./crudo/pelo_agua/PA_NXYZD.csv
ws-crs             = EPSG:5344
datum-name         = IGN SRVN16

; Progresivas (origen en el extremo NW del eje = 0)
chainage-offset    = 0

; Malla / lecho
dx                 = 0.5
vb-min             = 1

; Columnas del CSV de pelo de agua (descomentar si difieren de East/North/H_correg)
; ws-east-col      = East
; ws-north-col     = North
; ws-elev-col      = H_correg

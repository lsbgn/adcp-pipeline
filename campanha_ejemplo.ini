; ============================================================================
;  campanha_ejemplo_v6.ini — configuración de campaña para
;  process_adcp_bathimetric.py v6.7
;
;  Uso:   python process_adcp_bathimetric.py --config campanha.ini
;
;  * Las rutas se resuelven respecto de la carpeta de ESTE archivo.
;  * Lo que se pase por línea de comandos pisa lo que diga el INI.
;  * ';' inicia un comentario en cualquier sección.
;  * Las claves admiten '-' o '_' (gga-hdop-max = gga_hdop_max).
;  * Una clave comentada toma el valor por defecto que figura al lado.
; ============================================================================

[campanha]
nombre      = Relevamiento topobatimétrico río Neuquén — Cuatro Esquinas a Tercer Puente
fecha       = 2026-04-15
rio         = Neuquén
instrumento = SonTek RiverSurveyor M9 (GPS interno) en catamarán TB9s V7
gnss        = Kolida K9-S RTK, NTRIP RAMSAC-IGN estación NEQN
operador    =
notas       =

[procesamiento]
; ---------------------------------------------------------------- entradas
inputs            = transectas/          ; carpeta, archivos o globs de .mat de secciones
tracks            = recorridos/          ; .mat que NO son secciones (longitudinales, aproximaciones)
outdir            = salida/
survey-name       = neuquen_2026-04-15

; ---------------------------------------------------------------- red y CRS
centerline        = ../../SIG/R_LI-NE-NE.shp
; centerline-crs  = EPSG:5344            ; solo si el .shp no trae .prj
; out-crs         = EPSG:5344            ; por defecto, el CRS del centerline
transect-locate   = crossing             ; crossing | centroid
; chainage-offset = 0                    ; offset global; los de [progresivas] tienen prioridad

; ---------------------------------------------------------------- pelo de agua
water-surface-csv = gnss/pelo_de_agua.csv
ws-east-col       = East
ws-north-col      = North
ws-elev-col       = H_correg
ws-crs            = EPSG:5344
; stations        = ../../SIG/estaciones.csv
; readings        = niveles_2026-04-15.csv
; stations-crs    =                      ; por defecto = ws-crs
ws-qc-tol         = 0.10
; ws-axis-tol     = 300
; ws-extrap-tol   = 200
; ws-slope-min-span = 200
ws-slope-max      = 2.0                  ; m/km
; ws-default-slope = auto
datum-name        = IGN SRVN16
; allow-relative  = false

; ---------------------------------------------------------------- GNSS del M9 (6.7)
; Filtro de posiciones del bote. El GGA válido NO se toca; el descartado se
; reconstruye con el bottom track entre los fijos válidos de cada lado.
position-fill     = bt                   ; bt | interp | off (off = v6.6 exacto)
gga-hdop-max      = 4.0                  ; HDOP por encima: inválido (QRev). 0 = sin filtro
gga-hdop-change   = 2.0                  ; |HDOP - media de los válidos| por encima: inválido. 0 = sin filtro
gga-bt-tol        = 1.5                  ; [m] salto GGA respecto de la tendencia GGA-BT
gga-bt-window     = 30                   ; [s] semiventana de esa tendencia
s-fold-tol        = 2.0                  ; [m] QA: retroceso de s durante el cruce
edge-drift-tol    = 5.0                  ; [m] QA: deriva del bote durante la medición de borde
gps-max-gap       = 0.30                 ; fracción de ensambles sin fix que descarta la transecta
; allow-gps-gaps  = false

; ---------------------------------------------------------------- geometría del montaje
beam-layout       = auto                 ; auto | ccw | cw
pitch-roll        = off                  ; off | on | inv
; pitch-sign      = bow-up
; roll-sign       = stbd-down
; antenna-offset  =                      ; 'proa,estribor' [m], solo si no se cargó en RSL
; antenna-height  = 0.0
; gnss-lag        = 0.0
; time-epoch      = auto

; ---------------------------------------------------------------- profundidad
depth-ref         = auto                 ; auto | vb | bt (auto = lo elegido en RSL)
composite         = on
bt-avg            = idw
bt-geometry       = footprints
depth-filter      = smooth
; vb-min          = 1

; ---------------------------------------------------------------- lecho y márgenes
dx                = 0.5
bed-fit           = loess                ; loess | median (median = v6.3)
; bin-half-width  =                      ; loess: 0.75 m por defecto
edge-shape        = auto                 ; auto | triangular | rectangular
edge-extent       = mean
edge-anchor       = ref
; no-edge-extrapolation = false
offset-scale      = 3.0                  ; [m] penalización por distancia perpendicular
; no-offset-weighting = false

; ---------------------------------------------------------------- sección y aforos
flow-weighting    = discharge
density-weighting = on
; use-edge-ensembles = false
section-orientation = flow
group-tol         = 15
group-angle-tol   = 25
; group-max-span  = 0
; no-group-repeats = false

; ---------------------------------------------------------------- recorridos
tracks-beams      = all
; tracks-decimate = 1
; tracks-thin     = 0
tracks-csv        = on
; tracks-per-file = false
; tracks-locate-tol = 250

; ---------------------------------------------------------------- figuras
planview-labels   = auto


[progresivas]
; offset oficial [m] por río: km_oficial = offset + progresiva interna.
; Nombres como en el atributo 'river' del centerline.
Neuquen = 0                              ; ajustar: km 0 oficial en el dique compensador El Chañar
; Limay =
; Negro =


[grupos]
; Solo si la agrupación automática de aforos se equivoca.
; <nombre> = <id> <id> ...
; NQ31 = <id1> <id2> <id3> <id4>


[rios]
; Forzar el río de una transecta que la regla de cruce ubica mal.
; <id> = <río>


[ubicacion]
; Río, progresiva oficial y brazo forzados por transecta o grupo.
; <id> = <río> | <progresiva> [| <brazo>]


[orientacion]
; Sección forzada al recorrido del bote o a un azimut (p. ej., a lo largo de
; las compuertas de una obra). <id> = recorrido | flujo | <azimut en grados>


[saltos]
; Discontinuidades del pelo de agua (azud, dique, compuertas).
; <nombre> = <río> | <progresiva oficial>     o bien     <nombre> = <x> <y>


[recorridos]
; Solo para corregir la clase que asigna el clasificador.
; <id> = longitudinal | aproximacion | estatico | otro [| <río>]

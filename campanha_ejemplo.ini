; ===========================================================================
; Plantilla de configuración de campaña — process_adcp_bathimetric.py v6.5
; Uso:  python <ruta_al_script>\process_adcp_bathimetric.py --config campanha.ini
;
; - Copiar este archivo dentro de la carpeta de cada campaña y completarlo.
; - Las rutas RELATIVAS se resuelven respecto de la ubicación de ESTE .ini.
; - La línea de comandos SIEMPRE tiene prioridad sobre lo que se ponga acá.
; - ';' inicia un comentario en TODAS las secciones, también en [campanha]:
;   todo lo que sigue a ';' se descarta. Para separar ítems dentro de un
;   valor usar ' | '.
; - Toda opción de la línea de comandos es una clave válida (--group-tol se
;   escribe group-tol). Claves o secciones desconocidas se avisan en consola
;   y en procesamiento.txt; un valor fuera de las opciones corta la corrida.
; - El nombre de la sección de metadatos puede ser [campanha], [campania] o
;   [campaña]: las tres se reconocen.
; ===========================================================================

; --- Metadatos (solo trazabilidad; se copian a procesamiento.txt) ----------
[campanha]
campanha       = AAAA-MM-DD  <tramo relevado>
operador       = ADCP: <nombres> | GNSS: <nombres>
equipo         = SonTek RiverSurveyor M9 (s/n ....)
nivel_regla    = <lecturas de escala de referencia>
observaciones  = <caudales de referencia, incidencias> | <...>

; --- Parámetros de procesamiento -------------------------------------------
[procesamiento]
; Entradas: carpeta con los .mat, o varios .mat (uno por línea o separados por coma)
inputs             = ./crudo/adcp/transectos
outdir             = ./procesado
survey-name        = relevamiento-AAAAMMDD

; --- v6.2: recorridos ------------------------------------------------------
; Los .mat que NO son transectas: trayectos longitudinales entre secciones,
; aproximaciones, reposicionamientos, mediciones estáticas. No hay que
; listarlos: la carpeta alcanza y el clasificador etiqueta cada archivo.
; Salen como una nube de puntos categorizada (shp + csv) con río, progresiva
; oficial, offset firmado al eje y pelo de agua PUNTO POR PUNTO.
; No entran en survey_index.csv, ni en los aforos, ni en el perfil longitudinal.
tracks             = ./crudo/adcp/recorridos
; tracks-beams     = all         ; all | vb | slant  (también filtrable por beam_id)
; tracks-decimate  = 1           ; conservar 1 de cada N ensambles
; tracks-thin      = 0           ; [m] raleo por grilla, 0 = off
; tracks-csv       = on          ; on | off
; tracks-per-file  = false       ; además, un shp/CSV por archivo
; tracks-locate-tol = 250        ; [m] más allá: OFF_AXIS, se conserva sin progresiva

; Red de ejes: un feature por tramo río+rol, atributos river / role
; [/ seg_id / label / flow_dir]. La topología entre ríos (qué río desemboca
; en cuál) y los recorridos cabecera -> desembocadura se detectan solos.
centerline         = ../../ejes/R_LI-NE-NE.shp
; centerline-crs   = EPSG:5344   ; v6.2: sólo si al eje le falta el .prj
transect-locate    = crossing    ; crossing | centroid (centroid = regla v6.0)
; chainage-offset  = 0           ; offset global para ríos sin [progresivas]
; chainage-reverse = false

; --- v6.2: CRS de SALIDA ---------------------------------------------------
; UNO solo para todo lo que escribe la corrida: CSV y shapefiles por transecta
; y por grupo, capas de campaña, nube de recorridos y rótulos de las figuras.
; Default: el CRS del centerline. Debe ser proyectado y métrico.
; Importa si el relevamiento cruza de faja: el límite faja 2/3 cae en lon -67,5,
; o sea que el Negro aguas abajo de Chichinales es faja 3. Igual sale todo acá.
out-crs            = EPSG:5344

; Pelo de agua GNSS (fuente primaria). Columnas E/N/H; opcional una columna
; 'rio' que fuerza el río de un punto (útil en la confluencia).
water-surface-csv  = ./crudo/gnss/PA_AAAAMMDD.csv
ws-crs             = EPSG:5344
datum-name         = IGN SRVN16
; ws-east-col      = East
; ws-north-col     = North
; ws-elev-col      = H_correg

; Escalas: registro (CSV con X/Y, o vectorial de puntos) + lecturas de la
; campaña (spot: station_id,nivel | serie: station_id,datetime,nivel)
stations           = ../../estaciones/estaciones.csv
readings           = ./crudo/niveles/campanha_niveles_spot.csv
; stations-crs     = EPSG:5345   ; v6.2: CRS del registro si es CSV y NO es ws-crs
;                                ; (un registro vectorial usa su propio .prj)
; ws-qc-tol        = 0.10        ; [m] escala vs GNSS y dispersión en confluencias
; ws-extrap-tol    = 200         ; [m] extrapolación más larga -> WARN
; allow-relative   = false       ; true: seguir aunque ninguna transecta tenga pelo
; water-surface-elev = 0         ; cota constante, sólo sin CSV ni escalas

; --- v6.2: pendiente de continuación del pelo de agua ----------------------
; Fuera del rango de datos la superficie continúa con su pendiente local.
; Estas guardas existen porque v6.1 aceptaba cualquier par separado más de 1 m:
; dos escalas a 1,7 m con ceros 229,15 y 229,56 daban -241 m/km.
; ws-slope-min-span = 200        ; [m] separación mínima para definir la pendiente
; ws-slope-max      = 2.0        ; [m/km] banda física (el Comahue corre 0,55-1,0)
; ws-default-slope  = auto       ; auto | <m/km>

; --- v6.2: GNSS y tiempo ---------------------------------------------------
; RiverSurveyor escribe 0/0 al perder el fix; esos ensambles se descartan.
; gps-max-gap      = 0.30        ; fracción sin fix que aborta la transecta
; allow-gps-gaps   = false
; time-epoch       = auto        ; auto | sontek | unix | datenum
;                                ; auto = contra el sello AAAAMMDDhhmmss del nombre

; --- Malla / lecho ---------------------------------------------------------
; v6.4: dx es SÓLO la resolución de salida. El suavizado ya no depende de dx:
; lo fija bin-half-width, en metros. Antes, con dx = 1 el lecho salía de una
; mediana sobre 4 m y encima un Savitzky-Golay sobre otros 4 m.
dx                 = 1.0

; --- v6.4: cómo se estima el lecho -----------------------------------------
;   loess  : regresión lineal local robusta sobre los puntos de la referencia
;            primaria (núcleo tricúbico de bin-half-width, que sólo se ensancha
;            hasta el doble para juntar 3 puntos), relleno compuesto con la otra
;            fuente y rampas de margen pegadas DESPUÉS del ajuste
;   median : la regla de v6.3 (mediana ponderada por nodo + Savitzky-Golay sobre
;            toda la grilla). Sirve para reproducir una corrida vieja exacta.
bed-fit            = loess
; bin-half-width   = 0.75        ; [m] semiancho base del núcleo (loess).
;                                ; Con bed-fit = median el default es 2*dx.
; no-edge-extrapolation = false

; --- v6.3: extremo del lecho medido ----------------------------------------
; Hasta dónde llega el lecho medido, antes de trazar las rampas de margen.
;   mean : promedio del punto más externo de cada (repetición x haz)
;   max  : el punto más externo de toda la nube — regla de v6.2, sesgada hacia
;          afuera y creciente con la cantidad de pasadas y de haces
; Poner 'max' sólo para comparar contra una corrida vieja.
edge-extent        = mean

; --- v6.4: forma de la margen ----------------------------------------------
; auto lee lo que se cargó en RiverSurveyor (Setup.Edges_0/1__Method):
;   triangular  -> rampa recta desde el último punto medido hasta profundidad 0
;                  en la orilla (lo único que hacía v6.3)
;   rectangular -> la profundidad del extremo se mantiene hasta la orilla y
;                  cierra con una pared vertical (1 cm de ancho en planta)
; Un borde cargado como 'Q de usuario' no declara forma: se usa triangular.
; triangular | rectangular fuerzan las dos márgenes.
edge-shape         = auto

; --- Referencia de profundidad (modelo QRev) -------------------------------
depth-ref          = auto        ; auto | vb | bt   (auto = Setup.depthReference)
composite          = on          ; on | off         rellena con la otra fuente
bt-avg             = idw         ; idw | simple     IDW es el default de QRev
bt-geometry        = footprints  ; footprints | ensemble
edge-anchor        = ref         ; ref | cloud      anclaje de las rampas
vb-min             = 1           ; mín. puntos de la primaria por nodo
depth-filter       = smooth      ; smooth | off     rechazo de picos por haz

; --- v6.5: numeración de haces ---------------------------------------------
; auto lee la matriz de transformación de cada .mat (RSL: +X hacia el haz 1,
; +Z arriba). En el M9 el haz 2 está a BABOR ('ccw'). Hasta v6.4 se suponía a
; estribor: los haces 2 y 4 de 3 MHz y los cuatro de 1 MHz quedaban espejados
; respecto de la línea proa-popa. 'cw' sólo sirve para reproducir una corrida
; vieja.
beam-layout        = auto

; --- v6.5: actitud (pitch / roll) en la posición de las huellas ------------
; RSL ya entrega las profundidades verticales (compensadas por inclinación);
; lo que falta es DÓNDE cae cada huella. Con 10° de cabeceo y 3 m de agua el
; haz vertical pega 0,5 m adelante del transductor.
; SonTek no documenta el signo del M9, y con el signo cambiado el error se
; duplica. Antes de encenderlo correr sobre la carpeta de transectas:
;     python tools\diagnostico_mat.py <carpeta> > diag_mat.txt
; y copiar lo que recomienda la sección [5] (pasadas opuestas de los aforos),
; o fijar el signo en banco: levantar la proa (flecha del haz 1) y ver si el
; pitch sube (bow-up); levantar babor y ver si el roll sube (stbd-down).
pitch-roll         = off         ; off | on
; pitch-sign       = bow-up      ; bow-up | bow-down   (qué hace un pitch POSITIVO)
; roll-sign        = stbd-down   ; stbd-down | port-down | none (sólo pitch)
; antenna-height   = 0.0         ; [m] antena GNSS sobre la cara del transductor
; gnss-lag         = 0.0         ; [s] retardo de la posición GNSS
; antenna-offset   = 0.0, 0.0    ; [m] transductor respecto de la antena: proa, estribor
;                                ; (sólo si no se cargó en RSL; ver diagnóstico [6])

; --- v6.3: etiquetas de la vista en planta ---------------------------------
; Raleo por densidad en píxeles, no "una de cada N": los tramos sueltos
; conservan todas sus etiquetas y los racimos se ralean. Las secciones sin
; etiqueta quedan con un tick y siguen todas en survey_index.csv.
;   auto | all (regla v6.2) | every:N | none
; planview-labels  = auto

; --- Ponderación y acimut de la sección ------------------------------------
density-weighting  = on          ; on | off
flow-weighting     = discharge   ; discharge | density | none  (none = v5)
section-orientation = flow       ; flow | centerline (centerline NO implementado)
; use-edge-ensembles = false     ; incluir ensambles estacionarios de margen
offset-scale       = 3.0
; no-offset-weighting = false

; --- Agrupación de aforos --------------------------------------------------
group-tol          = 15.0        ; máx. Δ progresiva entre repeticiones [m]
group-angle-tol    = 25.0        ; máx. ángulo entre ejes de sección [°]
; group-max-span   = 0           ; tope de duración de una ocupación [min], 0 = off
; no-group-repeats = false       ; true = comportamiento v5

; --- Progresivas oficiales por río -----------------------------------------
; km_oficial = offset + progresiva interna. Los ríos que no figuren usan
; chainage-offset (0 por defecto). Los nombres se comparan sin tildes ni
; mayúsculas contra el atributo `river` del eje; uno que no coincide se avisa.
[progresivas]
Neuquen            = 0
Limay              = 0
Negro              = 0

; --- Agrupación manual de aforos (opcional) --------------------------------
; Sólo si el criterio automático se equivoca. Lo declarado acá tiene
; prioridad; el resto de las transectas pasa por el criterio automático.
;   <nombre del grupo> = <id> <id> <id> ...
; Los ids son los nombres de archivo sin extensión.
[grupos]
; aforo_km59 = 20260415110139 20260415110321 20260415110522 20260415110702

; --- Río forzado por transecta (opcional, v6.1) ----------------------------
; Cada transecta se ubica donde su sección cruza un eje. Si en algún caso
; (confluencias, islas, eje mal digitalizado) el río asignado es incorrecto,
; forzalo acá. La progresiva se toma sobre ese río.
;   <id de transecta> = <río>
[rios]
; 20260825145258 = Negro

; --- Recorridos: clase y río forzados (opcional, v6.2) ---------------------
; NO hace falta listar los recorridos: el clasificador los etiqueta solo por
; geometría (progresiva cubierta contra extensión transversal). Esta sección
; es únicamente para el caso que salga mal, o para forzar el río de un archivo
; medido en una confluencia, donde no hay sección perpendicular que cruce.
;   <id de archivo> = <clase> [| <río>]
;   clases: longitudinal | aproximacion | estatico | otro
[recorridos]
; 20260825151230 = longitudinal | Negro
; 20260825153044 = aproximacion
